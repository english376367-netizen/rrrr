</style></head><body><div class="wrap"><header class="hero"><h1>English 7 – Reading Units 1, 2 &amp; 3</h1><p>SBT Tiếng Anh 7 · Global Success</p><p>Chọn đáp án để chấm ngay. Mỗi câu chỉ được trả lời một lần; sau khi chọn sẽ khóa đáp án và hiện giải thích cùng nghĩa tiếng Việt.</p></header><div id="login" class="login"><h2>🔐 Vào làm bài</h2><label for="pw">Mật khẩu</label><input id="pw" type="password" inputmode="numeric" placeholder="Nhập mật khẩu"><button class="btn" onclick="unlock()">Bắt đầu</button><p id="msg" class="small"></p></div><main id="app" style="display:none"><div id="tabs" class="tabs"></div><div id="units"></div></main></div>
<script>
const units=[
{title:'Unit 1 – Hobbies',sets:[
{title:'Bài 1 – Mi’s email (điền từ)',passage:'Dear Jane,\\nI’m so happy to read your email. I like (1) _____ a pen pal in Australia because I love your country! Thank you for sending me a (2) _____ of your family. Can you tell me more about your family members? What do you (3) _____ doing together? I like watching films with my family. We (4) _____ watch many different kinds of films. Once, we watched a film about Australia, and I found it very interesting. I’m (5) _____ you a photo of my family. I can’t wait to read (6) _____ next email!\\nBest wishes,\\nMi',vi:'Jane thân mến,\\nMình rất vui khi đọc được thư của bạn. Mình thích có một người bạn qua thư ở Úc vì mình yêu đất nước của bạn! Cảm ơn bạn đã gửi cho mình một bức ảnh gia đình. Bạn có thể kể thêm về các thành viên trong gia đình không? Các bạn thích làm gì cùng nhau? Mình thích xem phim với gia đình. Chúng mình thường xem nhiều thể loại phim khác nhau. Có lần chúng mình xem một bộ phim về Úc và mình thấy rất thú vị. Mình đang gửi bạn một bức ảnh gia đình mình. Mình rất mong đọc thư tiếp theo của bạn!\\nThân mến, Mi.',items:[
['Blank (1): I like _____ a pen pal in Australia.',['have','having','has'],1,'Sau “like” có thể dùng V-ing để nói về sở thích: like having.','Mình thích có một người bạn qua thư ở Úc.'],
['Blank (2): a _____ of your family.',['photo','photographing','photogenic'],0,'Sau mạo từ “a” cần danh từ số ít; “photo” nghĩa là bức ảnh.','Cảm ơn bạn đã gửi một bức ảnh gia đình.'],
['Blank (3): What do you _____ doing together?',['want','like','need'],1,'Cấu trúc hỏi sở thích: What do you like doing?','Các bạn thích làm gì cùng nhau?'],
['Blank (4): We _____ watch many different kinds of films.',['usually','usual','use'],0,'“Usually” là trạng từ chỉ tần suất, đứng trước động từ thường “watch”.','Chúng mình thường xem nhiều thể loại phim khác nhau.'],
['Blank (5): I’m _____ you a photo of my family.',['send','sending','sends'],1,'Hiện tại tiếp diễn: am/is/are + V-ing; “I’m sending”.','Mình đang gửi bạn một bức ảnh gia đình.'],
['Blank (6): read _____ next email.',['you','your','yours'],1,'Trước danh từ “email” cần tính từ sở hữu “your”.','Mình mong đọc thư tiếp theo của bạn.']
]},
{title:'Bài 2 – Mark’s hobbies (điền từ)',passage:'Mark has a lot of hobbies and interests. He usually (1) _____ up early, so he can jog before school. After school, Mark often (2) _____ a horse at the riding club near his home. Sometimes he goes riding on Sunday afternoons. He also (3) _____ music. He goes to choir practice on Wednesday and Saturday evenings. (4) _____ Saturday mornings, he usually waters the plants and trees in the garden with his mum. He seldom watches TV because he likes doing things (5) _____. He has a lot of friends and he (6) _____ football with them twice a week. He’s a happy boy!',vi:'Mark có nhiều sở thích. Bạn ấy thường thức dậy sớm để có thể chạy bộ trước giờ học. Sau giờ học, Mark thường cưỡi ngựa ở câu lạc bộ gần nhà. Thỉnh thoảng bạn ấy cưỡi ngựa vào chiều Chủ nhật. Bạn ấy cũng yêu âm nhạc. Bạn ấy đi tập hát hợp xướng vào tối thứ Tư và thứ Bảy. Vào các sáng thứ Bảy, bạn ấy thường tưới cây trong vườn cùng mẹ. Bạn ấy hiếm khi xem TV vì thích hoạt động ngoài trời. Bạn ấy có nhiều bạn và chơi bóng đá với họ hai lần một tuần. Bạn ấy là một cậu bé vui vẻ!',items:[
['Blank (1): He usually _____ up early.',['gets','stays','does'],0,'Cụm “get up” nghĩa là thức dậy; chủ ngữ he nên dùng “gets”.','Bạn ấy thường thức dậy sớm.'],
['Blank (2): Mark often _____ a horse.',['cycles','drives','rides'],2,'Cụm “ride a horse” nghĩa là cưỡi ngựa.','Mark thường cưỡi ngựa.'],
['Blank (3): He also _____ music.',['makes','loves','does'],1,'“Love music” nghĩa là yêu/thích âm nhạc.','Bạn ấy cũng yêu âm nhạc.'],
['Blank (4): _____ Saturday mornings.',['On','In','At'],0,'Dùng “on” với ngày và buổi gắn với ngày: on Saturday mornings.','Vào các sáng thứ Bảy.'],
['Blank (5): doing things _____.',['inside','behind','outside'],2,'“Outside” nghĩa là ở ngoài trời, phù hợp với hoạt động ngoài trời.','Bạn ấy thích làm các hoạt động ngoài trời.'],
['Blank (6): he _____ football twice a week.',['is playing','plays','play'],1,'Thói quen và “twice a week” dùng hiện tại đơn; he + plays.','Bạn ấy chơi bóng đá hai lần một tuần.']
]},
{title:'Bài 3a – Hobbies are beneficial (từ vựng)',passage:'Do you have any hobbies? If you don’t, please start one because having a hobby is very beneficial. Firstly, a hobby gives you something fun to do during your leisure time, especially during pandemics. During the Covid-19 lockdown, my family reads books and watches films together. This makes us feel better when we have to stay at home. Secondly, a hobby makes you a more interesting person. If you have a lot of experience and skills, you can share them with others. I love traveling, and I usually share my experiences with my classmates. This way, I have more friends. Now we have a travel group in our class. Last but not least, a hobby can help you develop new skills. If you spend a lot of time on your hobby, your skills will improve. My sister loves sewing. After sewing for two years, she can now sew beautiful doll clothes. Those are the reasons why you should have hobbies.',vi:'Bạn có sở thích nào không? Nếu chưa, hãy bắt đầu một sở thích vì sở thích rất có lợi. Trước hết, sở thích đem lại điều thú vị để làm trong thời gian rảnh, đặc biệt trong các đợt đại dịch. Trong thời gian phong tỏa vì COVID-19, gia đình tôi đọc sách và xem phim cùng nhau. Điều này giúp chúng tôi cảm thấy tốt hơn khi phải ở nhà. Thứ hai, sở thích khiến bạn trở thành người thú vị hơn. Nếu có nhiều kinh nghiệm và kỹ năng, bạn có thể chia sẻ chúng với người khác. Tôi thích du lịch và thường chia sẻ trải nghiệm với bạn cùng lớp. Nhờ vậy, tôi có thêm bạn. Hiện lớp tôi có một nhóm du lịch. Cuối cùng, sở thích có thể giúp bạn phát triển kỹ năng mới. Nếu dành nhiều thời gian cho sở thích, kỹ năng sẽ tiến bộ. Chị/em gái tôi thích may vá. Sau hai năm, cô ấy có thể may quần áo búp bê đẹp. Đó là những lý do bạn nên có sở thích.',items:[
['“Beneficial” is closest in meaning to _____.',['helpful or useful','dangerous','expensive'],0,'Beneficial nghĩa là có lợi, hữu ích.','Sở thích rất có lợi.'],
['“Pandemics” refers to _____.',['diseases spreading widely across countries or the world','a hobby group','school holidays'],0,'Pandemic là đại dịch, dịch bệnh lan rộng trên nhiều quốc gia hoặc toàn thế giới.','Đặc biệt trong thời gian đại dịch.'],
['“Improve” means _____.',['become better','become smaller','stop doing something'],0,'Improve nghĩa là cải thiện, trở nên tốt hơn.','Kỹ năng của bạn sẽ được cải thiện.']
]},
{title:'Bài 3b – True / False / No Information',passage:'During the Covid-19 lockdown, my family reads books and watches films together. I love travelling, and I usually share my experiences with my classmates. This way, I have more friends. Now we have a travel group in our class. Last but not least, a hobby can help you develop new skills. My sister loves sewing. After sewing for two years, she can now sew beautiful doll clothes.',vi:'Trong thời gian phong tỏa vì COVID-19, gia đình tôi đọc sách và xem phim cùng nhau. Tôi thích du lịch và thường chia sẻ trải nghiệm với bạn cùng lớp. Nhờ vậy, tôi có thêm bạn. Hiện lớp tôi có một nhóm du lịch. Cuối cùng, sở thích có thể giúp bạn phát triển kỹ năng mới. Chị/em gái tôi thích may vá. Sau hai năm, cô ấy có thể may quần áo búp bê đẹp.',items:[
['The author’s family watches news during lockdown.',['True','False','No Information'],1,'Bài đọc nói gia đình xem phim (films), không phải xem tin tức (news).','Gia đình tác giả xem tin tức trong thời gian phong tỏa. (Sai)'],
['Travelling helps the author make more friends.',['True','False','No Information'],0,'Tác giả nói việc chia sẻ trải nghiệm du lịch giúp mình có thêm bạn.','Du lịch giúp tác giả có thêm bạn bè. (Đúng)'],
['There is a dancing club at the author’s school.',['True','False','No Information'],2,'Đoạn văn không đề cập câu lạc bộ khiêu vũ.','Có một câu lạc bộ khiêu vũ ở trường tác giả. (Không có thông tin)'],
['Hobbies can help people develop new skills.',['True','False','No Information'],0,'Bài đọc nêu trực tiếp sở thích giúp phát triển kỹ năng mới.','Sở thích có thể giúp mọi người phát triển kỹ năng mới. (Đúng)'],
['The author’s sister sews clothes for family members.',['True','False','No Information'],1,'Bài đọc nói cô ấy may quần áo cho búp bê, không phải cho các thành viên gia đình.','Chị/em gái tác giả may quần áo cho các thành viên gia đình. (Sai)']
]}]},
{title:'Unit 2 – Healthy living',sets:[
{title:'Bài 1 – Health tips (điền từ)',passage:'HEALTH TIPS\\na. Eat less salt and sugar. They put us at the risk of heart disease.\\nb. Drink enough water, about one and a half liters a day. Make sure that the water you are drinking is safe. Unsafe water can lead to many kinds of diseases.\\nc. Do more physical activities like sports and housework. It helps keep you fit and active.\\nd. Reduce sitting and screen time. Stand up every hour and do some simple exercise or walk around. Exercise your eyes too.\\ne. Get seven to eight hours of good sleep each night. This helps both your mind and body work well.\\nf. Handwash regularly with soap and water. Clean hands help prevent the spread of some diseases.',vi:'MẸO SỨC KHỎE\\na. Ăn ít muối và đường. Chúng làm tăng nguy cơ mắc bệnh tim.\\nb. Uống đủ nước, khoảng một lít rưỡi mỗi ngày. Hãy chắc chắn nước uống an toàn. Nước không an toàn có thể dẫn đến nhiều loại bệnh.\\nc. Tăng hoạt động thể chất như chơi thể thao và làm việc nhà. Điều đó giúp bạn khỏe mạnh và năng động.\\nd. Giảm thời gian ngồi và nhìn màn hình. Đứng dậy mỗi giờ, tập vài động tác đơn giản hoặc đi lại. Hãy vận động mắt nữa.\\ne. Ngủ ngon từ bảy đến tám tiếng mỗi đêm. Điều này giúp trí óc và cơ thể hoạt động tốt.\\nf. Thường xuyên rửa tay bằng xà phòng và nước. Tay sạch giúp ngăn sự lây lan của một số bệnh.',items:[
['Eating a lot of salt or sugar can lead to _____ disease.',['heart','skin','eye'],0,'Câu a nói muối và đường làm tăng nguy cơ heart disease (bệnh tim).','Ăn nhiều muối hoặc đường có thể dẫn đến bệnh tim.'],
['Drink only _____ water.',['unsafe','safe','sweet'],1,'Mẹo b yêu cầu đảm bảo nước uống an toàn: safe water.','Chỉ uống nước an toàn.'],
['Doing housework is also a type of _____ activity.',['physical','mental','musical'],0,'Mẹo c gọi thể thao và việc nhà là physical activities (hoạt động thể chất).','Làm việc nhà cũng là một loại hoạt động thể chất.'],
['Stand up every hour and do some _____.',['exercise','sleep','sugar'],0,'Mẹo d khuyên đứng lên và tập thể dục để giảm thời gian ngồi.','Đứng dậy mỗi giờ và tập thể dục một chút.'],
['Your mind works well if you get enough good _____.',['food','sleep','screen'],1,'Mẹo e nói ngủ đủ giấc giúp trí óc và cơ thể hoạt động tốt.','Trí óc hoạt động tốt nếu bạn ngủ đủ giấc.'],
['_____ regularly to prevent some diseases.',['Handwash','Eat sugar','Sit down'],0,'Mẹo f khuyên rửa tay thường xuyên để ngăn ngừa bệnh.','Thường xuyên rửa tay để phòng một số bệnh.']
]},
{title:'Bài 2 – Gardening and vegetables (điền từ)',passage:'My grandparents live in the countryside, and they have a big garden. They spend a lot of time working on it. When I visit them in summer, I often join them in the garden, and they teach me a lot of things about (1) _____. Vegetables come in different shapes, sizes, and (2) _____. Carrots and potatoes grow (3) _____ the ground. Some kinds of beans (4) _____ a high net to grow. My grandfather says that coloured vegetables are very good for health (5) _____ they provide a lot of natural vitamins. White cauliflower is (6) _____ in vitamin C. Orange carrots and red tomatoes contain vitamin A. (7) _____ have vitamins A, B, C, and E. Gardening is a good way of (8) _____. It helps him keep fit and strong.',vi:'Ông bà tôi sống ở nông thôn và có một khu vườn lớn. Họ dành nhiều thời gian chăm sóc vườn. Khi tôi đến thăm vào mùa hè, tôi thường làm vườn cùng họ và được dạy nhiều điều về rau củ. Rau củ có hình dạng, kích cỡ và màu sắc khác nhau. Cà rốt và khoai tây mọc dưới đất. Một số loại đậu cần giàn lưới cao để phát triển. Ông tôi nói rau củ nhiều màu rất tốt cho sức khỏe vì cung cấp nhiều vitamin tự nhiên. Súp lơ trắng giàu vitamin C. Cà rốt màu cam và cà chua đỏ chứa vitamin A. Bí ngô có vitamin A, B, C và E. Làm vườn là cách tập thể dục tốt, giúp ông khỏe mạnh.',items:[
['Blank (1): things about _____.',['health','vegetables','exercise'],1,'Ngữ cảnh đang nói về khu vườn và cây trồng, nên “vegetables” phù hợp.','Họ dạy tôi nhiều điều về rau củ.'],
['Blank (2): shapes, sizes, and _____.',['colours','prices','weight'],0,'Liệt kê tự nhiên: shapes, sizes, and colours (hình dạng, kích cỡ và màu sắc).','Rau củ có hình dạng, kích cỡ và màu sắc khác nhau.'],
['Blank (3): grow _____ the ground.',['above','on','under'],2,'Cà rốt và khoai tây phát triển dưới đất: under the ground.','Cà rốt và khoai tây mọc dưới đất.'],
['Blank (4): beans _____ a high net to grow.',['need','provide','have'],0,'“Need a high net” nghĩa là cần một giàn lưới cao để phát triển.','Một số loại đậu cần giàn lưới cao để phát triển.'],
['Blank (5): healthy _____ they provide vitamins.',['and','because','so'],1,'Because nêu lý do: rau củ tốt cho sức khỏe vì cung cấp vitamin.','Rau củ có màu tốt cho sức khỏe vì chúng cung cấp vitamin.'],
['Blank (6): cauliflower is _____ in vitamin C.',['rich','poor','low'],0,'Cụm “rich in” nghĩa là giàu một chất dinh dưỡng nào đó.','Súp lơ trắng giàu vitamin C.'],
['Blank (7): _____ have vitamins A, B, C, and E.',['Chicken','Fish','Pumpkins'],2,'Đáp án của bài là pumpkins (bí ngô).','Bí ngô có vitamin A, B, C và E.'],
['Blank (8): a good way of _____.',['resting','relaxing','exercising'],2,'Sau “a way of” dùng danh từ hoặc V-ing; gardening là một cách tập thể dục.','Làm vườn là một cách tập thể dục tốt.']
]},
{title:'Bài 3 – Spain and health',passage:'In 2019, Spain was the healthiest country in the world. The secret is their Mediterranean diet. This diet focuses on healthy fats and proteins. This includes cold tomato soup, plenty of seafood (especially fish), and veggies. Spanish people say that they have some of the most delicious salads in the world. Due to the Mediterranean diet, the Spanish suffer from fewer diseases than the rest of the world.\\nPhysical health is important, but mental health is important too. Eight out of ten Spanish people are happy. Why? A major reason is the weather. Spain has beautiful weather all year round. Another reason is that Spain is home to a lively and relaxing culture. The Spanish enjoy the simple pleasures of life.',vi:'Năm 2019, Tây Ban Nha là quốc gia khỏe mạnh nhất thế giới. Bí quyết là chế độ ăn Địa Trung Hải, tập trung vào chất béo và protein lành mạnh. Chế độ ăn này gồm súp cà chua lạnh, nhiều hải sản (đặc biệt là cá) và rau. Người Tây Ban Nha nói rằng họ có một số món salad ngon nhất thế giới. Nhờ chế độ ăn Địa Trung Hải, người Tây Ban Nha mắc ít bệnh hơn phần còn lại của thế giới.\\nSức khỏe thể chất quan trọng, nhưng sức khỏe tinh thần cũng vậy. Tám trong mười người Tây Ban Nha hạnh phúc. Tại sao? Một lý do chính là thời tiết. Tây Ban Nha có thời tiết đẹp quanh năm. Một lý do khác là đất nước này có nền văn hóa sôi động và thư thái. Người Tây Ban Nha tận hưởng những niềm vui giản dị của cuộc sống.',items:[
['In 2019, Spain was number _____ in health.',['one','two','ten'],0,'Bài đọc nói Spain là quốc gia khỏe mạnh nhất thế giới, tức đứng số một.','Năm 2019, Tây Ban Nha đứng số một về sức khỏe.'],
['The Mediterranean diet includes _____.',['lots of vegetables','red meat only','potato soup'],0,'Đoạn văn nhắc đến rau củ (veggies), hải sản và súp cà chua.','Chế độ ăn Địa Trung Hải có nhiều rau củ.'],
['Spanish people _____.',['have more diseases','have fewer diseases','do not have diseases'],1,'Bài đọc nói người Tây Ban Nha mắc ít bệnh hơn phần còn lại của thế giới.','Người Tây Ban Nha mắc ít bệnh hơn phần còn lại của thế giới.'],
['One reason Spanish people are happy is _____.',['beautiful weather','school exams','long working hours'],0,'Bài đọc nêu thời tiết đẹp quanh năm là một lý do khiến người dân hạnh phúc.','Một lý do khiến người Tây Ban Nha hạnh phúc là thời tiết đẹp.'],
['The Spanish enjoy _____.',['simple pleasures','only expensive food','long exams'],0,'Câu cuối nói người Tây Ban Nha tận hưởng những niềm vui giản dị của cuộc sống.','Người Tây Ban Nha tận hưởng những niềm vui giản dị.']
]}]},
{title:'Unit 3 – Community service',sets:[
{title:'Bài 1 – Volunteer activities (điền từ)',passage:'My school has a number of volunteer activities every summer. The activities include donating books to village children, (1) _____ kids in the neighborhood, teaching English to primary students, reading books or cooking food for the (2) _____. Our school started this programme five years ago. Every student can join one or two activities. In the beginning, we thought about (3) _____ we should join in these activities. We then thought about what (4) _____ we wanted to do. Those who like reading could choose to collect and donate (5) _____. Those who are good at English could (6) _____ primary students. Finally, we signed up for the activities we chose. Our teachers often encourage us to (7) _____ committed. We have a lot of fun and learn many things from (8) _____ the activities.',vi:'Trường tôi có nhiều hoạt động tình nguyện vào mỗi mùa hè. Các hoạt động gồm quyên góp sách cho trẻ em ở làng, dạy kèm trẻ em trong khu phố, dạy tiếng Anh cho học sinh tiểu học, đọc sách hoặc nấu ăn cho người nghèo. Trường bắt đầu chương trình này năm năm trước. Mỗi học sinh có thể tham gia một hoặc hai hoạt động. Ban đầu, chúng tôi nghĩ vì sao nên tham gia. Sau đó, chúng tôi nghĩ xem muốn làm hoạt động nào. Những người thích đọc có thể thu thập và quyên góp sách. Những người giỏi tiếng Anh có thể dạy kèm học sinh tiểu học. Cuối cùng, chúng tôi đăng ký hoạt động đã chọn. Giáo viên thường khuyến khích chúng tôi kiên trì. Chúng tôi vui vẻ và học được nhiều điều từ việc tham gia hoạt động.',items:[
['Blank (1): _____ kids in the neighborhood.',['tutor','tutored','tutoring'],2,'Sau “include” khi liệt kê hoạt động dùng V-ing: tutoring.','Các hoạt động gồm dạy kèm trẻ em trong khu phố.'],
['Blank (2): food for the _____.',['rich','needy','young'],1,'“The needy” nghĩa là những người nghèo/thiếu thốn cần giúp đỡ.','Nấu thức ăn cho những người cần giúp đỡ.'],
['Blank (3): we thought about _____ we should join.',['what','when','why'],2,'“Why” hỏi lý do: tại sao chúng tôi nên tham gia.','Chúng tôi nghĩ về lý do nên tham gia hoạt động.'],
['Blank (4): what _____ we wanted to do.',['activities','jobs','work'],0,'“What activities” nghĩa là những hoạt động nào.','Chúng tôi nghĩ về những hoạt động muốn làm.'],
['Blank (5): collect and donate _____.',['clothes','books','vegetables'],1,'Người thích đọc sách sẽ thu thập và quyên góp sách.','Những người thích đọc có thể quyên góp sách.'],
['Blank (6): could _____ primary students.',['learn','talk','tutor'],2,'Tutor nghĩa là dạy kèm.','Những người giỏi tiếng Anh có thể dạy kèm học sinh tiểu học.'],
['Blank (7): encourage us to _____ committed.',['live','stay','work'],1,'Cụm “stay committed” nghĩa là tiếp tục kiên trì/cam kết.','Giáo viên khuyến khích chúng tôi tiếp tục kiên trì.'],
['Blank (8): learn from _____ the activities.',['doing','working','playing'],0,'Sau giới từ “from” dùng V-ing; “do activities” là làm các hoạt động.','Chúng tôi học được nhiều điều từ việc tham gia hoạt động.']
]},
{title:'Bài 2a – History of volunteering (từ vựng)',passage:'People first used the word “volunteer” in 1795, but in England, there were at least 500 volunteer hospitals long before that. The YMCA in London became the first volunteering organization in 1844. It provided help to needy people and held classes to help people develop skills. The Red Cross became the first international charity organization in 1863. Volunteer work is becoming more and more popular in the world. In the USA, about one-fifth of the population does volunteer work. In Europe, thousands of volunteer programmes are run in different countries.\\nEveryone can do volunteer work to help their community. Volunteer activities include donating food and clothes, joining clean-up projects, tutoring children, protecting wild animals, etc. Volunteers work not for money but to help people in need and to connect with others.',vi:'Từ “tình nguyện viên” lần đầu được sử dụng vào năm 1795, nhưng ở Anh đã có ít nhất 500 bệnh viện tình nguyện từ trước đó. YMCA ở London trở thành tổ chức tình nguyện đầu tiên năm 1844. Tổ chức này giúp người nghèo và mở lớp giúp mọi người phát triển kỹ năng. Hội Chữ thập đỏ trở thành tổ chức từ thiện quốc tế đầu tiên năm 1863. Công việc tình nguyện ngày càng phổ biến trên thế giới. Ở Mỹ, khoảng một phần năm dân số làm tình nguyện. Ở châu Âu, hàng nghìn chương trình tình nguyện được tổ chức tại nhiều quốc gia.\\nAi cũng có thể làm tình nguyện để giúp cộng đồng. Hoạt động tình nguyện gồm quyên góp thức ăn và quần áo, tham gia dọn dẹp, dạy kèm trẻ em, bảo vệ động vật hoang dã, v.v. Tình nguyện viên không làm vì tiền mà để giúp người gặp khó khăn và kết nối với người khác.',items:[
['“Needy people” means _____.',['people who need help','rich people','famous people'],0,'“Needy people” là những người cần được giúp đỡ, thường là người nghèo/thiếu thốn.','Tổ chức giúp đỡ những người cần hỗ trợ.'],
['A “charity organization” is an organization that _____.',['helps people in need','sells expensive goods','runs sports competitions'],0,'Tổ chức từ thiện hoạt động nhằm giúp đỡ người gặp khó khăn.','Hội Chữ thập đỏ là một tổ chức từ thiện quốc tế.'],
['“Popular” means _____.',['liked by many people','very old','difficult to find'],0,'Popular nghĩa là phổ biến, được nhiều người biết đến hoặc yêu thích.','Công việc tình nguyện ngày càng phổ biến.'],
['A “community” is _____.',['a group of people living in a place','a type of food','a school subject'],0,'Community là cộng đồng, nhóm người sống trong cùng một địa phương/khu vực.','Mọi người có thể làm tình nguyện để giúp cộng đồng.']
]},
{title:'Bài 2b – True / False',passage:'The YMCA in London became the first volunteering organization in 1844. It provided help to needy people and held classes to help people develop skills. The Red Cross became the first international charity organization in 1863. Volunteer activities include donating food and clothes, joining clean-up projects, tutoring children, protecting wild animals, etc. Volunteers work not for money but to help people in need and to connect with others.',vi:'YMCA ở London trở thành tổ chức tình nguyện đầu tiên năm 1844. Tổ chức này giúp người nghèo và mở lớp để mọi người phát triển kỹ năng. Hội Chữ thập đỏ trở thành tổ chức từ thiện quốc tế đầu tiên năm 1863. Hoạt động tình nguyện gồm quyên góp thức ăn và quần áo, tham gia dọn dẹp, dạy kèm trẻ em, bảo vệ động vật hoang dã, v.v. Tình nguyện viên không làm vì tiền mà để giúp người gặp khó khăn và kết nối với người khác.',items:[
['The YMCA held classes to help people develop skills.',['True','False'],0,'Bài đọc nêu trực tiếp YMCA mở các lớp học giúp phát triển kỹ năng.','YMCA tổ chức lớp học giúp mọi người phát triển kỹ năng. (Đúng)'],
['The Red Cross became an international charity organization in 1863.',['True','False'],0,'Thông tin này được nêu trực tiếp trong bài.','Hội Chữ thập đỏ trở thành tổ chức từ thiện quốc tế năm 1863. (Đúng)'],
['Volunteers work mainly to earn money.',['True','False'],1,'Bài đọc nói tình nguyện viên không làm vì tiền mà để giúp người khác.','Tình nguyện viên chủ yếu làm việc để kiếm tiền. (Sai)'],
['Volunteer activities can include donating food and clothes.',['True','False'],0,'Bài đọc liệt kê quyên góp thức ăn và quần áo là hoạt động tình nguyện.','Hoạt động tình nguyện có thể gồm quyên góp thức ăn và quần áo. (Đúng)']
]},
{title:'Bài 3 – Benefits of volunteering',passage:'Choosing to volunteer takes up some of your time. Some people say that they do not have time to help others, so they don’t volunteer. But scientists say giving time to help others benefits us.\\nThe first benefit of volunteering is that it helps us learn to be flexible. Volunteers have to be ready for changes and stay flexible when solving problems. Second, volunteering can improve our health because it requires us to be active. A report found that Americans who volunteer 100 hours or more a year are the healthiest people in the country. Third, volunteers have opportunities to develop more relationships. They often work in teams, and team members get to know each other and sometimes even become friends. Moreover, volunteers often help needy people, so they may feel thankful for what they have. For these reasons, volunteers are generally positive and are less likely to become depressed. So if you have not joined a volunteer activity yet, think about it. You are likely to benefit from doing so.',vi:'Chọn làm tình nguyện sẽ tốn một phần thời gian. Một số người nói họ không có thời gian giúp người khác nên không tham gia. Nhưng các nhà khoa học cho rằng dành thời gian giúp người khác cũng có lợi cho chúng ta.\\nLợi ích đầu tiên của tình nguyện là giúp ta học cách linh hoạt. Tình nguyện viên cần sẵn sàng thay đổi và linh hoạt khi giải quyết vấn đề. Thứ hai, tình nguyện có thể cải thiện sức khỏe vì yêu cầu chúng ta năng động. Một báo cáo cho thấy người Mỹ làm tình nguyện ít nhất 100 giờ mỗi năm là những người khỏe mạnh nhất trong nước. Thứ ba, tình nguyện viên có cơ hội phát triển thêm các mối quan hệ. Họ thường làm việc theo nhóm, hiểu nhau và đôi khi trở thành bạn bè. Hơn nữa, họ thường giúp người khó khăn nên có thể biết ơn những gì mình có. Vì vậy, tình nguyện viên thường tích cực và ít có khả năng bị trầm cảm hơn. Nếu bạn chưa tham gia, hãy cân nhắc vì bạn có thể nhận được lợi ích.',items:[
['What is the main idea of the passage?',['Different types of volunteer activities','Good reasons to do volunteer work','How to earn money volunteering'],1,'Toàn bài tập trung vào những lợi ích của hoạt động tình nguyện: linh hoạt, khỏe mạnh và có thêm quan hệ.','Có những lý do tốt để tham gia công việc tình nguyện.'],
['Which is NOT stated as a benefit of volunteering?',['Being flexible','Improving health','Becoming the richest person'],2,'Bài nói về sự linh hoạt, sức khỏe, quan hệ và tinh thần tích cực; không nói sẽ trở nên giàu có.','Trở thành người giàu nhất không được nêu là lợi ích.'],
['How can volunteering help people socially?',['They can develop relationships and make friends.','They can avoid meeting people.','They can work only alone.'],0,'Bài đọc nói tình nguyện viên làm theo nhóm, hiểu nhau và có thể trở thành bạn bè.','Họ có thể phát triển các mối quan hệ và kết bạn.'],
['Why may volunteers feel thankful?',['They often help needy people.','They never have problems.','They receive a lot of money.'],0,'Bài đọc cho biết giúp đỡ người khó khăn khiến tình nguyện viên biết ơn những gì mình đang có.','Vì họ thường giúp những người cần hỗ trợ.']
]}]}
];
let answers={},qIndex={};
function unlock(){if(document.getElementById('pw').value==='367'){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init()}else document.getElementById('msg').textContent='Mật khẩu chưa đúng.'}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function init(){const tabs=document.getElementById('tabs'),root=document.getElementById('units');units.forEach((u,ui)=>{answers[ui]=u.sets.map(s=>s.items.map(()=>null));u.sets.forEach((s,si)=>qIndex[`${ui}_${si}`]=0);let t=document.createElement('button');t.className='btn tab'+(!ui?' active':'');t.textContent=u.title;t.onclick=()=>showUnit(ui);tabs.appendChild(t);let section=document.createElement('section');section.id='unit'+ui;section.className='unit'+(!ui?' active':'');section.innerHTML=`<div id="sets${ui}" class="tabs"></div><div id="content${ui}"></div>`;root.appendChild(section);u.sets.forEach((s,si)=>{let st=document.createElement('button');st.className='btn tab'+(!si?' active':'');st.textContent=s.title;st.onclick=()=>showSet(ui,si);document.getElementById('sets'+ui).appendChild(st);let d=document.createElement('div');d.className='panel';d.id=`set${ui}_${si}`;d.style.display=si?'none':'block';d.innerHTML=`<div class="meta"><h2>${s.title}</h2><div id="score${ui}_${si}" class="score"></div></div><div class="progress"><div id="bar${ui}_${si}"></div></div><div class="qnav" id="nav${ui}_${si}"></div><div id="q${ui}_${si}"></div><div class="navrow"><button class="btn secondary" id="prev${ui}_${si}" onclick="move(${ui},${si},-1)">← Câu trước</button><div><button class="btn secondary" onclick="resetSet(${ui},${si})">Reset phần này</button> <button class="btn" id="next${ui}_${si}" onclick="move(${ui},${si},1)">Câu tiếp →</button></div></div>`;document.getElementById(`content${ui}`).appendChild(d);render(ui,si)})})}
function showUnit(ui){document.querySelectorAll('.unit').forEach((e,i)=>e.classList.toggle('active',i===ui));document.querySelectorAll('#tabs .tab').forEach((e,i)=>e.classList.toggle('active',i===ui))}
function showSet(ui,si){document.querySelectorAll(`#sets${ui} .tab`).forEach((e,i)=>e.classList.toggle('active',i===si));units[ui].sets.forEach((_,i)=>document.getElementById(`set${ui}_${i}`).style.display=i===si?'block':'none')}
function render(ui,si){let s=units[ui].sets[si],idx=qIndex[`${ui}_${si}`],it=s.items[idx],ans=answers[ui][si][idx],nav=document.getElementById(`nav${ui}_${si}`);nav.innerHTML='';s.items.forEach((_,i)=>{let b=document.createElement('button');b.className='qnum'+(answers[ui][si][i]!==null?' done':'')+(i===idx?' current':'');b.textContent=i+1;b.onclick=()=>{qIndex[`${ui}_${si}`]=i;render(ui,si)};nav.appendChild(b)});let left=`<div class="pane"><h3>Reading passage</h3><div>${s.passage.replace(/\n/g,'<br>')}</div><div class="translation"><b>Bản dịch tiếng Việt</b><div>${s.vi.replace(/\n/g,'<br>')}</div></div></div>`;let right=`<div class="pane"><h3>Question ${idx+1}/${s.items.length}</h3><div class="question">${it[0]}</div><div class="options">`;it[1].forEach((o,oi)=>{let cls='opt';if(ans!==null){if(oi===it[2])cls+=' correct';else if(oi===ans)cls+=' wrong'}right+=`<button class="${cls}" ${ans!==null?'disabled':''} onclick="answer(${ui},${si},${idx},${oi})">${String.fromCharCode(65+oi)}. ${o}</button>`});right+='</div>';if(ans!==null){let ok=ans===it[2];right+=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✓ Chính xác!':'✗ Chưa chính xác.'}</b><p><b>Đáp án đúng:</b> ${String.fromCharCode(65+it[2])}. ${it[1][it[2]]}</p><p><b>Giải thích:</b> ${it[3]}</p><p><b>Nghĩa tiếng Việt:</b> ${it[4]}</p></div>`}right+='</div>';document.getElementById(`q${ui}_${si}`).innerHTML=`<div class="small">Câu ${idx+1}/${s.items.length}. Chọn một đáp án; sau khi chọn sẽ bị khóa.</div><div class="layout">${left}${right}</div>`;document.getElementById(`prev${ui}_${si}`).disabled=idx===0;document.getElementById(`next${ui}_${si}`).disabled=idx===s.items.length-1;let done=answers[ui][si].filter(x=>x!==null).length,score=answers[ui][si].filter((x,i)=>x===s.items[i][2]).length;document.getElementById(`score${ui}_${si}`).textContent=`Điểm: ${score}/${s.items.length} · Đã làm ${done}/${s.items.length}`;document.getElementById(`bar${ui}_${si}`).style.width=done/s.items.length*100+'%'}
function answer(ui,si,idx,choice){if(answers[ui][si][idx]!==null)return;answers[ui][si][idx]=choice;render(ui,si)}
function move(ui,si,delta){let k=`${ui}_${si}`;qIndex[k]=Math.max(0,Math.min(units[ui].sets[si].items.length-1,qIndex[k]+delta));render(ui,si)}
function resetSet(ui,si){if(!confirm('Bạn muốn xóa điểm và làm lại phần này?'))return;answers[ui][si]=units[ui].sets[si].items.map(()=>null);qIndex[`${ui}_${si}`]=0;render(ui,si)}
</script></body></html>
